[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slides2notes"
version = "0.1.0"
description = "Generate study notes from PDF slides using AI."
readme = "README.md"
authors = [{name = "Slides2Notes Team", email = "opensource@example.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pdf2image",
    "pypandoc",
    "tqdm",
    "python-dotenv",
    "openai",
    "google-generativeai",
    "edge-tts"
]

[tool.setuptools]
py-modules = ["Slides2Notes", "Notes2Notes", "Note2Audio", "AllInOne"]
